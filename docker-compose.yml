services:
  mariadb:
    image: mariadb:11
    container_name: bench_mariadb
    restart: "no"
    environment:
      MARIADB_ROOT_PASSWORD: benchmark123
      MARIADB_DATABASE: benchmark_db
    ports:
      - "3306:3306"
    volumes:
      - mariadb_data:/var/lib/mysql
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    command: >
      --innodb-buffer-pool-size=1G
      --max-connections=200

  postgres:
    image: postgres:16
    container_name: bench_postgres
    restart: "no"
    environment:
      POSTGRES_PASSWORD: benchmark123
      POSTGRES_DB: benchmark_db
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    deploy:
      resources:
        limits:
          cpus: "2.0"
          memory: 2G
    command: >
      postgres
      -c shared_buffers=1GB
      -c max_connections=200

volumes:
  mariadb_data:
  postgres_data:
